<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina nu a fost găsită (404) | Andrei Țolaș</title>
    <meta name="description"
        content="Pagina nu a fost găsită. Te redirecționăm automat către prima pagină a site-ului Andrei Țolaș - Recuperare Medicală la Domiciliu în Oradea.">
    <script>
        // Resolve paths dynamically based on deployment environment (custom domain vs. GitHub Pages subfolder)
        const isGithub = window.location.hostname.includes('github.io');
        const pathPrefix = isGithub ? '/HomeTherapyOradea/' : '/';

        // Inject styles
        const linkStyle = document.createElement('link');
        linkStyle.rel = 'stylesheet';
        linkStyle.href = pathPrefix + 'style.css';
        document.head.appendChild(linkStyle);

        // Inject favicon
        const linkIcon = document.createElement('link');
        linkIcon.rel = 'icon';
        linkIcon.type = 'image/png';
        linkIcon.href = pathPrefix + 'favicon.png';
        document.head.appendChild(linkIcon);
    </script>
    <style>
        .error-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #fff;
            text-align: center;
        }

        .error-content {
            max-width: 600px;
            background: rgba(255, 255, 255, 0.03);
            padding: 3.5rem 2rem;
            border-radius: var(--radius);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
        }

        .error-icon {
            font-size: 5rem;
            color: var(--primary);
            margin-bottom: 1.5rem;
            display: inline-block;
            animation: float 3s ease-in-out infinite;
        }

        .error-content h1 {
            font-size: clamp(2rem, 5vw, 2.5rem);
            margin-bottom: 1rem;
            font-weight: 700;
            color: #fff;
        }

        .error-content p {
            color: #cbd5e1;
            font-size: 1.1rem;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .error-countdown {
            font-size: 0.95rem;
            color: #94a3b8;
            margin-bottom: 2.5rem;
            background: rgba(255, 255, 255, 0.05);
            padding: 0.6rem 1.2rem;
            border-radius: 50px;
            display: inline-block;
        }

        .error-countdown strong {
            color: var(--primary);
            font-weight: 700;
        }

        .error-actions {
            display: flex;
            gap: 1.25rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .error-actions .btn {
            padding: 0.8rem 1.75rem;
            font-size: 1rem;
            font-weight: 600;
        }

        .error-actions .btn-outline {
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .error-actions .btn-outline:hover {
            background-color: #fff;
            color: #0f172a;
            border-color: #fff;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-12px);
            }
        }
    </style>
</head>

<body>
    <div class="error-container">
        <div class="error-content">
            <span class="error-icon">🧭</span>
            <h1>Pagina nu a fost găsită</h1>
            <p>Ne pare rău, pagina pe care o cauți nu există sau a fost mutată pe o altă adresă. Te redirecționăm
                imediat.</p>

            <div class="error-countdown" id="countdownContainer">
                Redirecționare automată către prima pagină în <strong id="countdown">10</strong> secunde...
            </div>

            <div class="error-actions">
                <a href="index.html" id="homeLink" class="btn btn-primary">Înapoi la Acasă</a>
                <a href="tel:0752847555" class="btn btn-outline">Sună Kinetoterapeut</a>
            </div>
        </div>
    </div>

    <script>
        const isGithubPages = window.location.hostname.includes('github.io');
        const repoPrefix = isGithubPages ? '/HomeTherapyOradea/' : '/';

        // Update home button link dynamically
        const homeLinkEl = document.getElementById('homeLink');
        if (homeLinkEl) {
            homeLinkEl.href = repoPrefix + "index.html";
        }

        let seconds = 10;
        const countdownEl = document.getElementById('countdown');

        const interval = setInterval(() => {
            seconds--;
            countdownEl.textContent = seconds;

            if (seconds <= 0) {
                clearInterval(interval);
                window.location.href = repoPrefix + "index.html";
            }
        }, 1000);
    </script>
</body>

</html>
